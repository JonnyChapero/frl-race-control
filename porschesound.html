<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche 911 GT3 Floating Sound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: transparent; /* Benar-benar transparan */
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Tombol yang akan diposisikan di atas tombol gas game */
        #gas-pedal {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(255, 0, 0, 0.15); /* Transparan merah tipis agar terlihat posisinya */
            border: 2px dashed rgba(255, 255, 255, 0.5);
            color: #fff; font-weight: bold; font-size: 13px;
            text-shadow: 1px 1px 2px #000;
            touch-action: manipulation;
        }
        
        /* Indikator saat pedal ditekan */
        #gas-pedal:active {
            background: rgba(0, 255, 100, 0.3);
            border-color: #00ff64;
        }

        .rpm-container {
            width: 70%; height: 6px; background: rgba(0,0,0,0.5);
            margin-top: 8px; border-radius: 3px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }
        #rpm-bar {
            width: 0%; height: 100%; background: #00ff64; transition: width 0.04s linear;
        }
    </style>
</head>
<body>

    <div id="gas-pedal">
        <span>GT3 GAS PEDAL</span>
        <div class="rpm-container"><div id="rpm-bar"></div></div>
    </div>

    <script>
        let audioCtx = null;
        let engineOsc = null;     // Suara Flat-6 Engine
        let gearWhineOsc = null;  // Suara Straight-Cut Gear Whine
        let engineGain = null;
        let gearGain = null;

        let currentRpm = 1000;    // Idle RPM
        let maxRpm = 9000;        // Redline GT3
        let isPressed = false;
        let rpmInterval = null;

        function initAudio() {
            if (audioCtx) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // 1. Suara Mesin Flat-6 (Sawtooth Wave)
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

            // 2. Suara Straight-Cut Gear (Sine Wave bernada tinggi khas balap)
            gearWhineOsc = audioCtx.createOscillator();
            gearWhineOsc.type = 'sine';
            gearGain = audioCtx.createGain();
            gearGain.gain.setValueAtTime(0.005, audioCtx.currentTime);

            // Hubungkan ke output audio HP
            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);

            gearWhineOsc.connect(gearGain);
            gearGain.connect(audioCtx.destination);

            engineOsc.start();
            gearWhineOsc.start();
            updateSoundParams();
        }

        function updateSoundParams() {
            if (!audioCtx) return;

            // Kalkulasi frekuensi mesin berdasarkan RPM
            let baseFreq = (currentRpm / 60) * 3; 
            engineOsc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);

            // Kalkulasi frekuensi gigi transmisi lurus (melengking tajam di atas suara mesin)
            let whineFreq = baseFreq * 2.75;
            gearWhineOsc.frequency.setValueAtTime(whineFreq, audioCtx.currentTime);

            // Update visual bar RPM kecil di tengah tombol
            let percent = ((currentRpm - 1000) / (maxRpm - 1000)) * 100;
            document.getElementById('rpm-bar').style.width = Math.max(0, Math.min(percent, 100)) + '%';
        }

        function pressGas() {
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isPressed = true;
            // Naikkan volume sedikit saat gas ditekan
            engineGain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.05);
            gearGain.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.05);

            clearInterval(rpmInterval);
            rpmInterval = setInterval(() => {
                if (isPressed && currentRpm < maxRpm) {
                    currentRpm += 200; // Kecepatan naik RPM
                    updateSoundParams();
                }
            }, 25);
        }

        function releaseGas() {
            isPressed = false;
            // Turunkan volume saat gas dilepas
            engineGain.gain.setTargetAtTime(0.02, audioCtx.currentTime, 0.1);
            gearGain.gain.setTargetAtTime(0.005, audioCtx.currentTime, 0.1);

            clearInterval(rpmInterval);
            rpmInterval = setInterval(() => {
                if (!isPressed && currentRpm > 1000) {
                    currentRpm -= 250; // Engine braking / RPM turun
                    updateSoundParams();
                } else if (currentRpm <= 1000) {
                    currentRpm = 1000;
                    updateSoundParams();
                    clearInterval(rpmInterval);
                }
            }, 25);
        }

        // Event listener untuk sentuhan HP (Touch & Mouse)
        const pedal = document.getElementById('gas-pedal');
        
        pedal.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressGas();
        }, { passive: false });

        pedal.addEventListener('touchend', (e) => {
            e.preventDefault();
            releaseGas();
        }, { passive: false });

        pedal.addEventListener('mousedown', pressGas);
        pedal.addEventListener('mouseup', releaseGas);
    </script>
</body>
</html>
