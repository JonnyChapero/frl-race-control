<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche GT3 Dashboard Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* TOMBOL AUDIO & SLIPSTREAM */
        .audio-btn, .slipstream-btn {
            background: #222;
            border: 1px solid #555;
            color: #00ff64;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        .audio-btn.off { color: #ff4444; }

        .slipstream-btn {
            color: #aaa;
            border-color: #444;
        }
        .slipstream-btn.active {
            background: #0055ff;
            color: #fff;
            border-color: #00d9ff;
            box-shadow: 0 0 15px #00ffff;
            animation: pulseGlow 1s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 8px #0088ff; }
            to { box-shadow: 0 0 18px #00ffff; }
        }

        /* 1. KOTAK BIRU BLINKING (0.3s) */
        .blue-box-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .blue-box {
            width: 160px;
            height: 60px;
            background-color: #0055ff;
            border: 2px solid #0022aa;
            box-shadow: 0 0 15px #0055ff;
            opacity: 0;
            border-radius: 4px;
        }

        .blink-animation {
            animation: sharpBlink 0.3s infinite steps(1, end);
        }

        @keyframes sharpBlink {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* 2. DASHBOARD DISPLAY PORSCHE */
        .dashboard {
            width: 100%;
            max-width: 440px;
            background: #111;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .led-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 12px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #444;
            transition: background 0.02s, box-shadow 0.02s;
        }
        .led.green.active { background: #00ff44; box-shadow: 0 0 10px #00ff44; }
        .led.yellow.active { background: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .led.red.active { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
        
        .led.blue-limiter { 
            background: #00d9ff !important; 
            box-shadow: 0 0 14px #00d9ff !important; 
        }

        .brand-title {
            text-align: center;
            font-weight: bold;
            letter-spacing: 6px;
            font-size: 15px;
            color: #d1d1d1;
            margin-bottom: 12px;
        }

        .dash-main {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 10px;
            background: #050505;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .telemetry-left {
            font-size: 10px;
            line-height: 1.5;
            color: #888;
        }
        .telemetry-left span { color: #fff; }

        .gear-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        .speed-val { font-size: 18px; color: #fff; font-weight: bold; font-family: monospace; }
        .speed-unit { font-size: 10px; color: #666; }
        .gear-val { font-size: 52px; font-weight: bold; color: #fff; line-height: 1; }

        .telemetry-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }
        .dry-badge {
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* 3. KONTROL (SHIFT & PEDAL) */
        .controls-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .shift-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .control-title {
            font-weight: bold;
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-shift {
            width: 80px;
            height: 70px;
            background: #111;
            border: 2px solid #333;
            color: white;
            font-size: 32px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-shift:active { background: #333; }

        .pedal-group {
            display: flex;
            gap: 20px;
        }
        .pedal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-box {
            width: 65px;
            height: 160px;
            background: #0a0a0a;
            border: 2px solid #222;
            border-radius: 8px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .slider-vertical {
            -webkit-appearance: none;
            width: 140px;
            height: 60px;
            background: transparent;
            transform: rotate(-90deg);
            cursor: pointer;
            z-index: 2;
        }

        .slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 50px;
            width: 20px;
            background: #444;
            border: 1px solid #888;
            border-radius: 4px;
        }

        .brake-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 0, 0, 0.6);
            pointer-events: none;
            z-index: 1;
        }
        .gas-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 255, 100, 0.6);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="audio-btn off" id="audio-toggle" onclick="toggleAudio()">🔊 Engine Sound: OFF</button>
        <button class="slipstream-btn" id="slipstream-toggle" onclick="toggleSlipstream()">💨 Slipstream: OFF</button>
    </div>

    <div class="blue-box-container">
        <div class="blue-box blink-animation"></div>
    </div>

    <div class="dashboard">
        <div class="led-container">
            <div class="led green" id="led-1"></div>
            <div class="led green" id="led-2"></div>
            <div class="led green" id="led-3"></div>
            <div class="led yellow" id="led-4"></div>
            <div class="led yellow" id="led-5"></div>
            <div class="led yellow" id="led-6"></div>
            <div class="led red" id="led-7"></div>
            <div class="led red" id="led-8"></div>
            <div class="led red" id="led-9"></div>
            <div class="led red" id="led-10"></div>
            <div class="led yellow" id="led-11"></div>
            <div class="led yellow" id="led-12"></div>
            <div class="led yellow" id="led-13"></div>
            <div class="led green" id="led-14"></div>
            <div class="led green" id="led-15"></div>
            <div class="led green" id="led-16"></div>
        </div>

        <div class="brand-title">PORSCHE</div>

        <div class="dash-main">
            <div class="telemetry-left">
                <div>RACE 1 💡</div>
                <br>
                <div>Oil T: <span>82.4°C</span></div>
                <div>Oil P: <span>5.8 bar</span></div>
                <div>Wat T: <span>73.4°C</span></div>
            </div>

            <div class="gear-center">
                <div class="speed-val"><span id="speed-display">0</span> <span class="speed-unit">km/h</span></div>
                <div class="gear-val" id="gear-display">N</div>
            </div>

            <div class="telemetry-right">
                <div class="dry-badge">DRY</div>
                <div style="font-size: 9px; color: #666; text-align: right; margin-top: 15px;">TYRE PRESS<br><span style="color:#aaa">20.5 | 20.5</span></div>
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="shift-group">
            <div class="control-title">Shift</div>
            <button class="btn-shift" onclick="shiftUp()">+</button>
            <button class="btn-shift" onclick="shiftDown()">-</button>
        </div>

        <div class="pedal-group">
            <div class="pedal-wrapper">
                <div class="control-title">Brake</div>
                <div class="slider-box">
                    <div class="brake-bar" id="brake-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="brake-slider" min="0" max="100" value="0">
                </div>
            </div>

            <div class="pedal-wrapper">
                <div class="control-title">Gas</div>
                <div class="slider-box">
                    <div class="gas-bar" id="gas-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="gas-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <script>
        // STATUS TRANSMISI & MOBIL
        let currentGear = 0; // 0 = N, 1..6
        const gearNames = ["N", "1", "2", "3", "4", "5", "6"];
        const gearMaxSpeeds = [0, 85, 140, 180, 225, 270, 311];
        
        // Torsi Dorong Mesin per Gigi
        const gearTorque = [0, 190, 120, 80, 52, 34, 23.8];

        let speed = 0;
        let rpm = 1000;
        let blinkState = false;
        let lastTime = performance.now();
        let isSlipstreamActive = false;

        // ELEMENT DOM
        const gasSlider = document.getElementById('gas-slider');
        const brakeSlider = document.getElementById('brake-slider');
        const gasVisual = document.getElementById('gas-visual');
        const brakeVisual = document.getElementById('brake-visual');
        const gearDisplay = document.getElementById('gear-display');
        const speedDisplay = document.getElementById('speed-display');
        const audioBtn = document.getElementById('audio-toggle');
        const slipstreamBtn = document.getElementById('slipstream-toggle');

        // WEB AUDIO API SYNTHESIZER
        let audioCtx = null;
        let osc1 = null, osc2 = null;
        let gainNode = null, filterNode = null;
        let isAudioOn = false;

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            osc1 = audioCtx.createOscillator();
            osc2 = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            filterNode = audioCtx.createBiquadFilter();

            osc1.type = 'sawtooth';
            osc2.type = 'triangle';

            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(800, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);

            osc1.connect(filterNode);
            osc2.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isAudioOn = !isAudioOn;
            if (isAudioOn) {
                audioBtn.innerText = "🔊 Engine Sound: ON";
                audioBtn.classList.remove('off');
            } else {
                audioBtn.innerText = "🔊 Engine Sound: OFF";
                audioBtn.classList.add('off');
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            }
        }

        function toggleSlipstream() {
            isSlipstreamActive = !isSlipstreamActive;
            if (isSlipstreamActive) {
                slipstreamBtn.innerText = "💨 Slipstream: ON";
                slipstreamBtn.classList.add('active');
            } else {
                slipstreamBtn.innerText = "💨 Slipstream: OFF";
                slipstreamBtn.classList.remove('active');
            }
        }

        function updateAudio(currentRpm, gasVal) {
            if (!isAudioOn || !audioCtx) return;

            let baseFreq = (currentRpm / 60) * 3;
            osc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.03);
            osc2.frequency.setTargetAtTime(baseFreq * 0.5, audioCtx.currentTime, 0.03);

            let cutoff = 400 + (currentRpm * 0.8) + (gasVal * 1500);
            filterNode.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.03);

            let volume = 0.03 + (gasVal * 0.12) + (currentRpm / 9000) * 0.08;

            if (currentRpm >= 8800 && blinkState) {
                volume *= 0.1;
            }

            gainNode.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.02);
        }

        function shiftUp() {
            if (currentGear < 6) {
                currentGear++;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        function shiftDown() {
            if (currentGear > 0) {
                currentGear--;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        // SIMULASI UTAMA (Physics Loop)
        function updatePhysics(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = now;

            let gasVal = parseInt(gasSlider.value) / 100;
            let brakeVal = parseInt(brakeSlider.value) / 100;

            gasVisual.style.height = (gasVal * 100) + '%';
            brakeVisual.style.height = (brakeVal * 100) + '%';

            // Draf/Drag Udara Kuadratik
            // Slipstream mengurangi drag hingga 35%
            let dragCoeff = isSlipstreamActive ? 0.00021 : 0.00032;
            let airDrag = dragCoeff * (speed * speed);
            let rollingFriction = 0.8; 
            let totalNaturalResistance = airDrag + rollingFriction;
            
            let brakeForce = brakeVal * 38; 

            if (currentGear === 0) {
                let targetRpm = 1000 + (gasVal * 8000);
                rpm += (targetRpm - rpm) * (15 * dt);

                let netForce = - (totalNaturalResistance + brakeForce);
                speed += netForce * dt;

            } else {
                let maxSpeedThisGear = gearMaxSpeeds[currentGear];
                let calculatedRpm = (speed / maxSpeedThisGear) * 9000;

                let engineForce = 0;
                if (gasVal > 0 && calculatedRpm < 9000) {
                    engineForce = gasVal * gearTorque[currentGear];
                }

                let engineBrake = (gasVal === 0) ? 1.5 : 0;

                let netForce = engineForce - totalNaturalResistance - engineBrake - brakeForce;
                speed += netForce * dt;

                if (speed > maxSpeedThisGear) {
                    speed = maxSpeedThisGear;
                }

                rpm = (speed / maxSpeedThisGear) * 9000;
                if (rpm < 1000) rpm = 1000;
            }

            if (speed < 0) speed = 0;

            // Efek Turbulensi Angin / Oscillation di Kecepatan Tinggi saat Drag ~ Engine Force (Gigi 5 & 6)
            let displaySpeed = speed;
            if (gasVal > 0.8 && currentGear >= 5 && speed > 240 && !isSlipstreamActive) {
                // Efek fluktuasi angka 274 -> 275 -> 274 km/h akibat turbulensi hambatan angin
                let windTurbulence = (Math.sin(now * 0.012) * 0.6) + ((Math.random() - 0.5) * 0.4);
                displaySpeed = Math.max(0, speed + windTurbulence);
            }

            speedDisplay.innerText = Math.floor(displaySpeed);
            updateLeds(rpm);
            updateAudio(rpm, gasVal);

            requestAnimationFrame(updatePhysics);
        }

        function updateLeds(currentRpm) {
            const minRpm = 4500;
            const maxRpm = 8800;

            for (let i = 1; i <= 16; i++) {
                let led = document.getElementById('led-' + i);
                led.classList.remove('active', 'blue-limiter');
            }

            if (currentRpm >= maxRpm) {
                blinkState = !blinkState;
                if (blinkState) {
                    for (let i = 1; i <= 16; i++) {
                        document.getElementById('led-' + i).classList.add('blue-limiter');
                    }
                }
            } 
            else if (currentRpm > minRpm) {
                let pairCount = Math.floor(((currentRpm - minRpm) / (maxRpm - minRpm)) * 8);
                for (let p = 1; p <= pairCount; p++) {
                    if (p <= 8) {
                        document.getElementById('led-' + p).classList.add('active');
                        document.getElementById('led-' + (17 - p)).classList.add('active');
                    }
                }
            }
        }

        function setupAutoReturn(slider) {
            const releaseHandler = () => {
                let returnInterval = setInterval(() => {
                    let val = parseInt(slider.value);
                    if (val > 0) {
                        slider.value = Math.max(0, val - 12);
                    } else {
                        clearInterval(returnInterval);
                    }
                }, 15);
            };

            slider.addEventListener('mouseup', releaseHandler);
            slider.addEventListener('touchend', releaseHandler);
        }

        setupAutoReturn(gasSlider);
        setupAutoReturn(brakeSlider);

        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
