<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche 911 GT3 Sound Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gas-pedal {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(255, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.6);
            color: #fff; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 3px #000;
            touch-action: manipulation;
        }
        
        #gas-pedal:active {
            background: rgba(0, 255, 100, 0.4);
            border-color: #00ff64;
        }

        .rpm-container {
            width: 80%; height: 8px; background: rgba(0,0,0,0.6);
            margin-top: 10px; border-radius: 4px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.4);
        }
        #rpm-bar {
            width: 0%; height: 100%; background: #00ff64; transition: width 0.03s linear;
        }
    </style>
</head>
<body>

    <div id="gas-pedal">
        <span>GT3 REAL AUDIO GAS</span>
        <div class="rpm-container"><div id="rpm-bar"></div></div>
    </div>

    <!-- Audio Element Menggunakan Sampel Suara Porsche GT3 / Straight Cut Gear -->
    <audio id="gt3-audio" loop preload="auto" src="https://actions.google.com/sounds/v1/transportation/car_accel.ogg"></audio>

    <script>
        const audio = document.getElementById('gt3-audio');
        const pedal = document.getElementById('gas-pedal');
        const rpmBar = document.getElementById('rpm-bar');

        let isPressed = false;
        let currentPitch = 0.6; // Idle pitch
        let maxPitch = 2.2;     // High RPM + Straight cut gear pitch
        let interval = null;

        function pressGas() {
            if (!isPressed) {
                isPressed = true;
                if (audio.paused) {
                    audio.play().catch(e => console.log("Audio Play Error:", e));
                }

                clearInterval(interval);
                interval = setInterval(() => {
                    if (isPressed && currentPitch < maxPitch) {
                        currentPitch += 0.05; // Kecepatan akselerasi RPM
                        audio.playbackRate = currentPitch;

                        // Visual Bar RPM
                        let percent = ((currentPitch - 0.6) / (maxPitch - 0.6)) * 100;
                        rpmBar.style.width = Math.min(percent, 100) + '%';
                    }
                }, 30);
            }
        }

        function releaseGas() {
            isPressed = false;
            clearInterval(interval);
            
            interval = setInterval(() => {
                if (!isPressed && currentPitch > 0.6) {
                    currentPitch -= 0.06; // Deselerasi / Engine Brake
                    audio.playbackRate = currentPitch;

                    let percent = ((currentPitch - 0.6) / (maxPitch - 0.6)) * 100;
                    rpmBar.style.width = Math.max(percent, 0) + '%';
                } else if (currentPitch <= 0.6) {
                    currentPitch = 0.6;
                    audio.playbackRate = 0.6;
                    rpmBar.style.width = '0%';
                    clearInterval(interval);
                }
            }, 30);
        }

        pedal.addEventListener('touchstart', (e) => { e.preventDefault(); pressGas(); });
        pedal.addEventListener('touchend', (e) => { e.preventDefault(); releaseGas(); });
        pedal.addEventListener('mousedown', pressGas);
        pedal.addEventListener('mouseup', releaseGas);
    </script>
</body>
</html>
