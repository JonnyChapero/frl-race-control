<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche GT3 Dashboard Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #2b2b2b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 1. KOTAK BIRU BLINKING */
        .blue-box-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .blue-box {
            width: 160px;
            height: 70px;
            background-color: #0055ff;
            border: 2px solid #0022aa;
            box-shadow: 0 0 15px #0055ff;
            opacity: 0;
        }

        .blink-animation {
            animation: sharpBlink 4.5s infinite steps(1, end);
        }

        @keyframes sharpBlink {
            0%   { opacity: 1; }
            5.5% { opacity: 0; }
            11%  { opacity: 1; }
            16.5%{ opacity: 0; }
            22%  { opacity: 1; }
            27.5%{ opacity: 0; }
            33%  { opacity: 1; }
            38.5%{ opacity: 0; }
            44%  { opacity: 1; }
            49.5%{ opacity: 0; }
            100% { opacity: 0; }
        }

        /* 2. DASHBOARD DISPLAY PORSCHE */
        .dashboard {
            width: 100%;
            max-width: 440px;
            background: #111;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            position: relative;
        }

        .led-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 10px;
        }
        .led {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #444;
            transition: background 0.03s, box-shadow 0.03s;
        }
        .led.green.active { background: #00ff44; box-shadow: 0 0 8px #00ff44; }
        .led.yellow.active { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red.active { background: #ff0000; box-shadow: 0 0 8px #ff0000; }
        
        .led.blue-limiter { 
            background: #00d9ff !important; 
            box-shadow: 0 0 12px #00d9ff !important; 
        }

        .brand-title {
            text-align: center;
            font-weight: bold;
            letter-spacing: 5px;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .dash-main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .telemetry-left {
            font-size: 10px;
            line-height: 1.4;
            color: #aaa;
        }

        .gear-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        .speed-val { font-size: 16px; color: #fff; font-weight: bold; }
        .gear-val { font-size: 48px; font-weight: bold; color: #fff; line-height: 1; }

        .telemetry-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dry-badge {
            align-self: flex-end;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* 3. KONTROL BAWAH (SHIFT, BRAKE, GAS) */
        .controls-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .shift-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .control-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 2px;
            text-align: center;
        }

        .btn-shift {
            width: 85px;
            height: 75px;
            background: #000;
            border: 2px solid #333;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-shift:active { background: #333; }

        .pedal-group {
            display: flex;
            gap: 15px;
        }
        .pedal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-box {
            width: 70px;
            height: 160px;
            background: #000;
            border: 2px solid #333;
            border-radius: 6px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-vertical {
            -webkit-appearance: none;
            width: 140px;
            height: 50px;
            background: transparent;
            transform: rotate(-90deg);
            cursor: pointer;
        }

        .slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 15px;
            background: #555;
            border: 1px solid #fff;
            border-radius: 3px;
        }

        .brake-bar {
            position: absolute;
            bottom: 5px;
            width: 50px;
            background: #ff0000;
            border-radius: 2px;
            pointer-events: none;
        }
        .gas-bar {
            position: absolute;
            bottom: 5px;
            width: 50px;
            background: #00ff64;
            border-radius: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="blue-box-container">
        <div class="blue-box blink-animation"></div>
    </div>

    <div class="dashboard">
        <div class="led-container">
            <div class="led green" id="led-1"></div>
            <div class="led green" id="led-2"></div>
            <div class="led green" id="led-3"></div>
            <div class="led yellow" id="led-4"></div>
            <div class="led yellow" id="led-5"></div>
            <div class="led yellow" id="led-6"></div>
            <div class="led red" id="led-7"></div>
            <div class="led red" id="led-8"></div>
            <div class="led red" id="led-9"></div>
            <div class="led red" id="led-10"></div>
            <div class="led yellow" id="led-11"></div>
            <div class="led yellow" id="led-12"></div>
            <div class="led yellow" id="led-13"></div>
            <div class="led green" id="led-14"></div>
            <div class="led green" id="led-15"></div>
            <div class="led green" id="led-16"></div>
        </div>

        <div class="brand-title">PORSCHE</div>

        <div class="dash-main">
            <div class="telemetry-left">
                <div>RACE 1 💡</div>
                <br>
                <div>Oil temp: 82.4</div>
                <div>Oil press: 5.8</div>
                <div>Water temp: 73.4</div>
            </div>

            <div class="gear-center">
                <div class="speed-val" id="speed-display">0</div>
                <div class="gear-val" id="gear-display">N</div>
            </div>

            <div class="telemetry-right">
                <div class="dry-badge">DRY</div>
                <div style="font-size: 9px; color: #888;">TYRE PRESS<br>20.5 | 20.5</div>
            </div>
        </div>
    </div>

    <div class="controls-container">
        <div class="shift-group">
            <div class="control-title">shift</div>
            <button class="btn-shift" onclick="shiftUp()">+</button>
            <button class="btn-shift" onclick="shiftDown()">-</button>
        </div>

        <div class="pedal-group">
            <div class="pedal-wrapper">
                <div class="control-title">Brake<br>throttle</div>
                <div class="slider-box">
                    <div class="brake-bar" id="brake-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="brake-slider" min="0" max="100" value="0">
                </div>
            </div>

            <div class="pedal-wrapper">
                <div class="control-title">Gas<br>Throttle</div>
                <div class="slider-box">
                    <div class="gas-bar" id="gas-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="gas-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentGear = 0; // 0 = N, 1-6 = Gigi 1-6
        const gearNames = ["N", "1", "2", "3", "4", "5", "6"];
        
        // Batas Kecepatan Maksimal Sesuai Spesifikasi (km/h)
        const gearMaxSpeed = [0, 85, 140, 180, 225, 270, 311];
        
        // Kecepatan Minimal Ideal per Gigi
        const gearMinSpeed = [0, 0, 45, 80, 120, 160, 200];

        // Koefisien Torsi / Akselerasi Realistis (Gigi tinggi lebih berat)
        const gearPowerFactor = [0, 0.28, 0.18, 0.10, 0.055, 0.032, 0.018];

        let currentSpeed = 0;  
        let currentRpm = 1000; 
        let blinkState = false;

        const gasSlider = document.getElementById('gas-slider');
        const brakeSlider = document.getElementById('brake-slider');
        const gasVisual = document.getElementById('gas-visual');
        const brakeVisual = document.getElementById('brake-visual');

        const gearDisplay = document.getElementById('gear-display');
        const speedDisplay = document.getElementById('speed-display');

        function shiftUp() {
            if (currentGear < 6) {
                currentGear++;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        function shiftDown() {
            if (currentGear > 0) {
                currentGear--;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        // Loop Simulasi Fisika Real-Time (Setiap 20ms)
        setInterval(() => {
            let gasVal = parseInt(gasSlider.value) / 100;     
            let brakeVal = parseInt(brakeSlider.value) / 100; 

            gasVisual.style.height = (gasVal * 140) + 'px';
            brakeVisual.style.height = (brakeVal * 140) + 'px';

            // --- DINAMIKA FISIKA ---

            // 1. Hambatan Alami Halus (Air Drag & Rolling Resistance)
            // Nilai kecil agar kendaraan meluncur melambat sangat perlahan saat lepas gas
            let airDrag = 0.00012 * (currentSpeed * currentSpeed);
            let rollingResistance = 0.02;
            let naturalDecel = airDrag + rollingResistance;

            // 2. Rem (Brake Power)
            let brakingPower = brakeVal * 1.8;

            if (currentGear === 0) {
                // POSISI NETRAL (N)
                if (gasVal > 0) {
                    currentRpm += gasVal * 250;
                } else {
                    currentRpm -= 150;
                }
                // Meluncur bebas tanpa engine brake
                currentSpeed -= (naturalDecel + brakingPower);

            } else {
                // POSISI BERGIGI (1 - 6)
                let maxGearSpd = gearMaxSpeed[currentGear];
                
                // Pembatas Kecepatan Berdasarkan Gigi
                // Jika mobil sudah lebih kencang dari batas gigi, mesin menahan (Engine Limit)
                let canAccelerate = currentSpeed < maxGearSpd;

                // Torsi Mesin berdasarkan Posisi Pedal & Gigi
                let acceleration = 0;
                if (gasVal > 0 && canAccelerate) {
                    // Efisiensi daya jika gigi terlalu tinggi pada kecepatan rendah (Beban Mesin)
                    let efficiency = 1.0;
                    if (currentSpeed < gearMinSpeed[currentGear]) {
                        efficiency = 0.35 + (currentSpeed / gearMinSpeed[currentGear]) * 0.65;
                    }
                    acceleration = gasVal * gearPowerFactor[currentGear] * efficiency * 22;
                }

                // Engine Brake sangat ringan saat lepas gas
                let engineBrake = (gasVal === 0) ? 0.03 : 0;

                // Hitung Perubahan Kecepatan
                currentSpeed += (acceleration - naturalDecel - engineBrake - brakingPower);

                // Hitung RPM Mesin Terhubung Langsung ke Laju Roda
                // Menggunakan rasio antar rentang gigi
                let prevGearMax = gearMaxSpeed[currentGear - 1];
                let speedInGear = currentSpeed - prevGearMax;
                let gearRange = maxGearSpd - prevGearMax;

                if (currentSpeed <= prevGearMax) {
                    // RPM Rendah / Under-rev
                    targetRpm = 1200 + (currentSpeed / prevGearMax) * 2000;
                } else {
                    targetRpm = 3200 + (speedInGear / gearRange) * 5800; // 3200 s/d 9000 RPM
                }

                // Transisi RPM Halus mengikuti beban roda
                currentRpm += (targetRpm - currentRpm) * 0.15;
            }

            // Batas Min/Max
            if (currentSpeed < 0) currentSpeed = 0;
            if (currentRpm < 1000) currentRpm = 1000;
            if (currentRpm > 9000) currentRpm = 9000;

            // Tampilkan Kecepatan
            speedDisplay.innerText = Math.floor(currentSpeed);

            // Update 16 LED Shift Lights
            updateLeds(currentRpm);

        }, 20);

        function updateLeds(rpm) {
            const minRpm = 4500;
            const maxRpm = 8800;

            for (let i = 1; i <= 16; i++) {
                let led = document.getElementById('led-' + i);
                led.classList.remove('active', 'blue-limiter');
            }

            // OVERREV / LIMITER: Kedip Biru Seluruh LED
            if (rpm >= maxRpm) {
                blinkState = !blinkState;
                if (blinkState) {
                    for (let i = 1; i <= 16; i++) {
                        document.getElementById('led-' + i).classList.add('blue-limiter');
                    }
                }
            } 
            // PROGRESIF LED
            else if (rpm > minRpm) {
                let pairCount = Math.floor(((rpm - minRpm) / (maxRpm - minRpm)) * 8);
                for (let p = 1; p <= pairCount; p++) {
                    if (p <= 8) {
                        document.getElementById('led-' + p).classList.add('active');
                        document.getElementById('led-' + (17 - p)).classList.add('active');
                    }
                }
            }
        }

        // Auto Return Pedal saat dilepas
        gasSlider.addEventListener('touchend', () => { autoReturn(gasSlider); });
        gasSlider.addEventListener('mouseup', () => { autoReturn(gasSlider); });
        brakeSlider.addEventListener('touchend', () => { autoReturn(brakeSlider); });
        brakeSlider.addEventListener('mouseup', () => { autoReturn(brakeSlider); });

        function autoReturn(slider) {
            let interval = setInterval(() => {
                if (parseInt(slider.value) > 0) {
                    slider.value = parseInt(slider.value) - 10;
                } else {
                    slider.value = 0;
                    clearInterval(interval);
                }
            }, 15);
        }
    </script>
</body>
</html>
