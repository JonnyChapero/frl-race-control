<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche GT3 Dashboard Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #2b2b2b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* 1. KOTAK BIRU BLINKING (TEGAS / SHARP ON-OFF) */
        .blue-box-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .blue-box {
            width: 160px;
            height: 70px;
            background-color: #0055ff;
            border: 2px solid #0022aa;
            box-shadow: 0 0 15px #0055ff;
            opacity: 0;
        }

        /* Animasi 5x Kedip Tegas (0.5s per siklus) lalu Mati 2s (Total 4.5s) */
        .blink-animation {
            animation: sharpBlink 4.5s infinite steps(1, end);
        }

        @keyframes sharpBlink {
            0%   { opacity: 1; }
            5.5% { opacity: 0; }
            11%  { opacity: 1; }
            16.5%{ opacity: 0; }
            22%  { opacity: 1; }
            27.5%{ opacity: 0; }
            33%  { opacity: 1; }
            38.5%{ opacity: 0; }
            44%  { opacity: 1; }
            49.5%{ opacity: 0; }
            100% { opacity: 0; }
        }

        /* 2. DASHBOARD DISPLAY PORSCHE */
        .dashboard {
            width: 100%;
            max-width: 440px;
            background: #111;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Shift Light 16 LED Dots */
        .led-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 10px;
        }
        .led {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #444;
            transition: background 0.03s, box-shadow 0.03s;
        }
        .led.green.active { background: #00ff44; box-shadow: 0 0 8px #00ff44; }
        .led.yellow.active { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red.active { background: #ff0000; box-shadow: 0 0 8px #ff0000; }

        .brand-title {
            text-align: center;
            font-weight: bold;
            letter-spacing: 5px;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .dash-main {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .telemetry-left {
            font-size: 10px;
            line-height: 1.4;
            color: #aaa;
        }

        .gear-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
        }
        .speed-val { font-size: 16px; color: #fff; font-weight: bold; }
        .gear-val { font-size: 48px; font-weight: bold; color: #fff; line-height: 1; }

        .telemetry-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dry-badge {
            align-self: flex-end;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
        }

        /* 3. KONTROL BAWAH (SHIFT, BRAKE, GAS) */
        .controls-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .shift-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .control-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 2px;
            text-align: center;
        }

        .btn-shift {
            width: 85px;
            height: 75px;
            background: #000;
            border: 2px solid #333;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-shift:active { background: #333; }

        .pedal-group {
            display: flex;
            gap: 15px;
        }
        .pedal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-box {
            width: 70px;
            height: 160px;
            background: #000;
            border: 2px solid #333;
            border-radius: 6px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-vertical {
            -webkit-appearance: none;
            width: 140px;
            height: 50px;
            background: transparent;
            transform: rotate(-90deg);
            cursor: pointer;
        }

        .slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 15px;
            background: #555;
            border: 1px solid #fff;
            border-radius: 3px;
        }

        .brake-bar {
            position: absolute;
            bottom: 5px;
            width: 50px;
            background: #ff0000;
            border-radius: 2px;
            pointer-events: none;
        }
        .gas-bar {
            position: absolute;
            bottom: 5px;
            width: 50px;
            background: #00ff64;
            border-radius: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- KOTAK BIRU KANAN ATAS -->
    <div class="blue-box-container">
        <div class="blue-box blink-animation"></div>
    </div>

    <!-- PORSCHE DASHBOARD -->
    <div class="dashboard">
        <!-- SHIFT LIGHTS (16 LED: LUAR KIRI & KANAN -> TENGAH) -->
        <div class="led-container">
            <!-- Kiri (1-8) -->
            <div class="led green" id="led-1"></div>
            <div class="led green" id="led-2"></div>
            <div class="led green" id="led-3"></div>
            <div class="led yellow" id="led-4"></div>
            <div class="led yellow" id="led-5"></div>
            <div class="led yellow" id="led-6"></div>
            <div class="led red" id="led-7"></div>
            <div class="led red" id="led-8"></div>
            <!-- Kanan (9-16) -->
            <div class="led red" id="led-9"></div>
            <div class="led red" id="led-10"></div>
            <div class="led yellow" id="led-11"></div>
            <div class="led yellow" id="led-12"></div>
            <div class="led yellow" id="led-13"></div>
            <div class="led green" id="led-14"></div>
            <div class="led green" id="led-15"></div>
            <div class="led green" id="led-16"></div>
        </div>

        <div class="brand-title">PORSCHE</div>

        <div class="dash-main">
            <div class="telemetry-left">
                <div>RACE 1 💡</div>
                <br>
                <div>Oil temp: 82.4</div>
                <div>Oil press: 5.8</div>
                <div>Water temp: 73.4</div>
            </div>

            <div class="gear-center">
                <div class="speed-val" id="speed-display">0</div>
                <div class="gear-val" id="gear-display">N</div>
            </div>

            <div class="telemetry-right">
                <div class="dry-badge">DRY</div>
                <div style="font-size: 9px; color: #888;">TYRE PRESS<br>20.5 | 20.5</div>
            </div>
        </div>
    </div>

    <!-- CONTROLS SECTION -->
    <div class="controls-container">
        <!-- SHIFT GEAR -->
        <div class="shift-group">
            <div class="control-title">shift</div>
            <button class="btn-shift" onclick="shiftUp()">+</button>
            <button class="btn-shift" onclick="shiftDown()">-</button>
        </div>

        <!-- BRAKE & GAS THROTTLE -->
        <div class="pedal-group">
            <div class="pedal-wrapper">
                <div class="control-title">Brake<br>throttle</div>
                <div class="slider-box">
                    <div class="brake-bar" id="brake-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="brake-slider" min="0" max="100" value="0">
                </div>
            </div>

            <div class="pedal-wrapper">
                <div class="control-title">Gas<br>Throttle</div>
                <div class="slider-box">
                    <div class="gas-bar" id="gas-visual" style="height: 0px;"></div>
                    <input type="range" class="slider-vertical" id="gas-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentGear = 0; 
        const gearNames = ["N", "1", "2", "3", "4", "5", "6"];
        const gearRatios = [0, 40, 75, 115, 155, 195, 240];

        let currentRpm = 1000;
        let currentSpeed = 0;

        const gasSlider = document.getElementById('gas-slider');
        const brakeSlider = document.getElementById('brake-slider');
        const gasVisual = document.getElementById('gas-visual');
        const brakeVisual = document.getElementById('brake-visual');

        const gearDisplay = document.getElementById('gear-display');
        const speedDisplay = document.getElementById('speed-display');

        function shiftUp() {
            if (currentGear < 6) {
                currentGear++;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        function shiftDown() {
            if (currentGear > 0) {
                currentGear--;
                gearDisplay.innerText = gearNames[currentGear];
            }
        }

        // Loop Simulasi Fisika
        setInterval(() => {
            let gasVal = parseInt(gasSlider.value);
            let brakeVal = parseInt(brakeSlider.value);

            gasVisual.style.height = (gasVal * 1.4) + 'px';
            brakeVisual.style.height = (brakeVal * 1.4) + 'px';

            if (gasVal > 0) {
                if (currentRpm < 9000) currentRpm += (gasVal * 1.8);
            } else {
                if (currentRpm > 1000) currentRpm -= 120;
            }

            if (brakeVal > 0 && currentRpm > 1000) currentRpm -= (brakeVal * 3);

            if (currentRpm < 1000) currentRpm = 1000;
            if (currentRpm > 9000) currentRpm = 9000;

            if (currentGear > 0) {
                let targetSpeed = (currentRpm / 9000) * gearRatios[currentGear];
                currentSpeed += (targetSpeed - currentSpeed) * 0.1;
            } else {
                currentSpeed *= 0.95;
            }

            speedDisplay.innerText = Math.round(currentSpeed);

            // Update 16 LED Shift Lights (Luar ke Dalam)
            updateLeds(currentRpm);

        }, 30);

        function updateLeds(rpm) {
            const minRpm = 3000;
            const maxRpm = 8800;
            let pairCount = 0; // Maksimal 8 pasang LED

            if (rpm > minRpm) {
                pairCount = Math.floor(((rpm - minRpm) / (maxRpm - minRpm)) * 8);
            }

            // Reset semua LED
            for (let i = 1; i <= 16; i++) {
                document.getElementById('led-' + i).classList.remove('active');
            }

            // Menyalakan dari luar menuju ke tengah secara berpasangan
            for (let p = 1; p <= pairCount; p++) {
                if (p <= 8) {
                    document.getElementById('led-' + p).classList.add('active');             // Dari Kiri ke Tengah (1 - 8)
                    document.getElementById('led-' + (17 - p)).classList.add('active');      // Dari Kanan ke Tengah (16 - 9)
                }
            }
        }

        // Auto Return Pedal
        gasSlider.addEventListener('touchend', () => { autoReturn(gasSlider); });
        gasSlider.addEventListener('mouseup', () => { autoReturn(gasSlider); });
        brakeSlider.addEventListener('touchend', () => { autoReturn(brakeSlider); });
        brakeSlider.addEventListener('mouseup', () => { autoReturn(brakeSlider); });

        function autoReturn(slider) {
            let interval = setInterval(() => {
                if (slider.value > 0) {
                    slider.value -= 10;
                } else {
                    slider.value = 0;
                    clearInterval(interval);
                }
            }, 15);
        }
    </script>
</body>
</html>
