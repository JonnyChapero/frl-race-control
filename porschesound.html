<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Porsche 911 GT3 YouTube Sound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gas-pedal {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(255, 0, 0, 0.25);
            border: 2px dashed rgba(255, 255, 255, 0.7);
            color: #fff; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 3px #000;
            touch-action: manipulation;
        }
        
        #gas-pedal:active {
            background: rgba(0, 255, 100, 0.4);
            border-color: #00ff64;
        }

        #yt-player {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="gas-pedal">
        <span>GT3 YT SOUND GAS</span>
        <span style="font-size: 10px; opacity: 0.8; margin-top: 4px;">Tekan untuk melaju</span>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player"></div>

    <script>
        let player;
        let isReady = false;
        let isPressed = false;
        const startTime = 63; // Detik 1:03

        // Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '200',
                width: '200',
                videoId: 'EqbGR3-jKZQ',
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'start': startTime
                },
                events: {
                    'onReady': () => { isReady = true; }
                }
            });
        }

        function pressGas() {
            if (isReady && !isPressed) {
                isPressed = true;
                player.seekTo(startTime, true);
                player.playVideo();
            }
        }

        function releaseGas() {
            if (isReady) {
                isPressed = false;
                player.pauseVideo();
            }
        }

        const pedal = document.getElementById('gas-pedal');
        pedal.addEventListener('touchstart', (e) => { e.preventDefault(); pressGas(); }, { passive: false });
        pedal.addEventListener('touchend', (e) => { e.preventDefault(); releaseGas(); }, { passive: false });
        pedal.addEventListener('mousedown', pressGas);
        pedal.addEventListener('mouseup', releaseGas);
    </script>
</body>
</html>
