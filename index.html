<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PENCEGAH CACHE BROWSER -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>FR Legends Race Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        
        .page { display: none !important; }
        #home-menu.active { display: block !important; margin-top: 20px; }
        #admin-page.active { display: block !important; }
        #driver-setup.active { display: block !important; margin-top: 20px; }
        
        #driver-page.active { 
            display: flex !important; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh; 
            z-index: 999999; 
            background-color: #000;
            overflow: hidden;
        }

        h1, h2, h3 { margin-bottom: 15px; }
        
        .nav-btn { 
            display: block; 
            width: 90%; 
            max-width: 300px; 
            margin: 15px auto; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            color: white; 
        }
        .btn-admin { background-color: #007bff; }
        .btn-driver { background-color: #28a745; }
        
        .input-box {
            width: 90%;
            max-width: 300px;
            padding: 12px;
            margin: 10px auto;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 16px;
            text-align: center;
            display: block;
        }

        #flag-display { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            font-size: clamp(14px, 6vw, 24px); 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center; 
            padding: 5px; 
            word-wrap: break-word; 
            line-height: 1.2; 
            color: white; 
            background-color: #333; 
        }
        .sub-text-display {
            font-size: clamp(12px, 4vw, 18px);
            font-weight: bold;
            margin-top: 10px;
        }

        #password-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            padding-top: 50px;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 320px;
            margin: auto;
            border: 1px solid #444;
        }

        .flag-btn { width: 90%; max-width: 350px; padding: 14px; margin: 8px auto; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; display: block; }
        .green { background-color: #28a745; color: white; }
        .yellow { background-color: #ffc107; color: black; }
        .fcy { background-color: #ff9800; color: black; }
        .red { background-color: #dc3545; color: white; }
        .finish { background-color: #000; color: white; border: 2px solid #fff; }
        .clear { background-color: #333; color: white; border: 1px solid #555; }
        
        .blue-section {
            background: #1a233a;
            border: 1px solid #2a3b66;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            width: 90%;
            max-width: 350px;
        }
        .driver-blue-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn { background-color: #6c757d; color: white; margin-top: 15px; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; }
        .reset-btn { background-color: #dc3545; color: white; padding: 8px 14px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. MENU UTAMA -->
    <div id="home-menu" class="page active">
        <h1>RACE CONTROL SYSTEM</h1>
        <button class="nav-btn btn-admin" onclick="openPasswordModal()">Panel Admin</button>
        <button class="nav-btn btn-driver" onclick="handleDriverClick()">Tampilan Driver</button>
    </div>

    <!-- 2. MODAL PASSWORD ADMIN -->
    <div id="password-modal">
        <div class="modal-content">
            <h3>Akses Race Director</h3>
            <input type="password" id="admin-pass-input" class="input-box" placeholder="Masukkan Password">
            <button class="nav-btn btn-admin" style="width:100%; padding:10px; margin:0;" onclick="verifyPassword()">Masuk</button>
            <button class="back-btn" style="margin-top:10px;" onclick="closePasswordModal()">Batal</button>
        </div>
    </div>

    <!-- 3. DRIVER SETUP -->
    <div id="driver-setup" class="page">
        <h2>Registrasi Driver</h2>
        <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Sekali terdaftar, nomor tidak dapat diubah sendiri.</p>
        <input type="text" id="driver-name" class="input-box" placeholder="Nama Driver">
        <input type="number" id="driver-number" class="input-box" placeholder="Nomor Mobil (contoh: 05)">
        <button class="nav-btn btn-driver" onclick="registerDriver()">MASUK LINTASAN</button>
        <button class="back-btn" onclick="showPage('home-menu')">Kembali</button>
    </div>

    <!-- 4. HALAMAN ADMIN -->
    <div id="admin-page" class="page">
        <h2>Panel Race Director</h2>
        
        <button class="flag-btn green" onclick="setGlobalFlag('GREEN FLAG', '', '#28a745', '#ffffff', false, 'standard')">GREEN FLAG</button>
        <button class="flag-btn yellow" onclick="setGlobalFlag('YELLOW FLAG', 'LIMIT 80 KM/H', '#ffc107', '#000000', true, 'standard')">YELLOW FLAG</button>
        <button class="flag-btn fcy" onclick="setGlobalFlag('FULL COURSE YELLOW', '80 KM/H', '#ff9800', '#000000', true, 'fcy')">FCY</button>
        <button class="flag-btn red" onclick="setGlobalFlag('RED FLAG', 'BACK TO PIT', '#dc3545', '#ffffff', true, 'standard')">RED FLAG</button>
        <button class="flag-btn finish" onclick="setGlobalFlag('FINISH / CHEQUERED', '', '#000000', '#ffffff', false, 'standard')">FINISH</button>
        <button class="flag-btn clear" onclick="setGlobalFlag('TRACK CLEAR', '', '#333333', '#ffffff', false, 'standard')">TRACK CLEAR</button>

        <div class="blue-section">
            <h3 style="color:#00aaff;">BLUE FLAG TARGET</h3>
            <p style="font-size:12px; color:#ccc; margin-bottom:10px;">Pilih driver yang harus memberi jalan:</p>
            <div id="driver-buttons-list">
                <i style="font-size:12px; color:#888;">Belum ada driver terhubung...</i>
            </div>
            <br>
            <button class="back-btn" style="background:#ff9800; color:#000;" onclick="clearAllBlueFlags()">Reset Status Blue Flag</button>
            <br>
            <button class="reset-btn" onclick="removeAllDrivers()">Hapus/Reset Daftar Driver</button>
        </div>

        <button class="back-btn" onclick="showPage('home-menu')">Kembali ke Menu</button>
    </div>

    <!-- 5. HALAMAN BENDERA DRIVER -->
    <div id="driver-page" class="page">
        <div id="flag-display">
            <div id="main-text">WAITING...</div>
            <div id="sub-text" class="sub-text-display"></div>
        </div>
    </div>

    <!-- Firebase SDK & Script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const ADMIN_PASSWORD = "wildunnigga123";

        const firebaseConfig = {
            databaseURL: "https://frl-race-direction-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let myDriverNumber = localStorage.getItem('registered_driver_num') || "";
        let blinkInterval = null;

        window.addEventListener('DOMContentLoaded', function() {
            if (myDriverNumber) {
                showPage('driver-page', false);
            }
        });

        function showPage(pageId, addHistory) {
            if (addHistory === undefined) addHistory = true;
            
            const pages = document.querySelectorAll('.page');
            pages.forEach(function(p) { p.classList.remove('active'); });
            
            const target = document.getElementById(pageId);
            if (target) {
                target.classList.add('active');
            }

            if (addHistory && pageId !== 'home-menu') {
                history.pushState({ page: pageId }, "", "#" + pageId);
            }
        }

        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.page) {
                if (myDriverNumber && event.state.page !== 'driver-page') {
                    showPage('driver-page', false);
                } else {
                    showPage(event.state.page, false);
                }
            } else {
                if (myDriverNumber) {
                    showPage('driver-page', false);
                } else {
                    showPage('home-menu', false);
                }
            }
        });

        function handleDriverClick() {
            if (myDriverNumber) {
                showPage('driver-page');
            } else {
                showPage('driver-setup');
            }
        }

        function openPasswordModal() {
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('password-modal').style.display = 'block';
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
        }

        function verifyPassword() {
            const input = document.getElementById('admin-pass-input').value;
            if (input === ADMIN_PASSWORD) {
                closePasswordModal();
                showPage('admin-page');
            } else {
                alert("Password Salah!");
            }
        }

        function registerDriver() {
            const nameInput = document.getElementById('driver-name').value.trim();
            const numInput = document.getElementById('driver-number').value.trim();

            if (!nameInput || !numInput) {
                alert("Mohon isi Nama dan Nomor Mobil!");
                return;
            }

            database.ref('race/drivers').once('value', function(snapshot) {
                const drivers = snapshot.val() || {};
                
                let isNumTaken = false;
                let isNameTaken = false;

                Object.keys(drivers).forEach(function(key) {
                    if (drivers[key].number === numInput) isNumTaken = true;
                    if (drivers[key].name.toLowerCase() === nameInput.toLowerCase()) isNameTaken = true;
                });

                if (isNumTaken) {
                    alert("Nomor Mobil #" + numInput + " sudah digunakan! Pilih nomor lain.");
                    return;
                }

                if (isNameTaken) {
                    alert("Nama '" + nameInput + "' sudah terdaftar!");
                    return;
                }

                localStorage.setItem('registered_driver_num', numInput);
                myDriverNumber = numInput;

                database.ref('race/drivers/' + numInput).set({
                    name: nameInput,
                    number: numInput
                });

                showPage('driver-page');
            });
        }

        function setGlobalFlag(statusText, subText, bgColor, textColor, isBlinking, modeType) {
            database.ref('race/blue_flags').remove();

            database.ref('race/status').set({
                text: statusText,
                subText: subText || '',
                bg: bgColor,
                color: textColor,
                blink: isBlinking || false,
                mode: modeType || 'standard'
            });
        }

        function toggleBlueFlag(driverNum) {
            const ref = database.ref('race/blue_flags/' + driverNum);
            ref.once('value', function(snapshot) {
                if (snapshot.exists()) {
                    ref.remove();
                } else {
                    ref.set(true);
                }
            });
        }

        function clearAllBlueFlags() {
            database.ref('race/blue_flags').remove();
        }

        function removeAllDrivers() {
            if (confirm("Yakin ingin menghapus SELURUH daftar driver dari session ini?")) {
                database.ref('race/drivers').remove();
                database.ref('race/blue_flags').remove();
            }
        }

        database.ref('race/drivers').on('value', function(snapshot) {
            const listDiv = document.getElementById('driver-buttons-list');
            const drivers = snapshot.val();
            
            if (!drivers) {
                if (myDriverNumber) {
                    localStorage.removeItem('registered_driver_num');
                    myDriverNumber = "";
                    showPage('home-menu');
                }
                if (listDiv) listDiv.innerHTML = '<i style="font-size:12px; color:#888;">Belum ada driver terhubung...</i>';
                return;
            }

            database.ref('race/blue_flags').on('value', function(blueSnap) {
                const blueList = blueSnap.val() || {};
                if (listDiv) {
                    listDiv.innerHTML = '';

                    Object.keys(drivers).forEach(function(num) {
                        const d = drivers[num];
                        const isBlue = blueList[num] ? true : false;

                        const btn = document.createElement('button');
                        btn.className = 'driver-blue-btn';
                        btn.style.backgroundColor = isBlue ? '#00d2ff' : '#0056b3';
                        btn.style.color = isBlue ? '#000' : '#fff';
                        btn.innerText = '#' + d.number + ' - ' + d.name + (isBlue ? ' (BLUE)' : '');
                        btn.onclick = function() { toggleBlueFlag(d.number); };

                        listDiv.appendChild(btn);
                    });
                }
            });
        });

        database.ref('race').on('value', function(snapshot) {
            const data = snapshot.val();
            if (!data) return;

            const globalStatus = data.status || {};
            const blueFlags = data.blue_flags || {};

            const display = document.getElementById('flag-display');
            const mainText = document.getElementById('main-text');
            const subText = document.getElementById('sub-text');

            if (!display || !mainText || !subText) return;

            if (blinkInterval) {
                clearInterval(blinkInterval);
                blinkInterval = null;
            }

            if (myDriverNumber && blueFlags[myDriverNumber]) {
                let isBlue = true;
                mainText.innerText = "BLUE FLAG";
                subText.innerText = "GIVE WAY TO LEADER!";
                
                blinkInterval = setInterval(function() {
                    display.style.backgroundColor = isBlue ? "#0044ff" : "#000000";
                    display.style.color = "#ffffff";
                    isBlue = !isBlue;
                }, 500);

            } else if (globalStatus.blink) {
                let step = 0;

                function updateBlink() {
                    if (globalStatus.mode === 'fcy') {
                        // SIKLUS KHUSUS FCY (4 TAHAP @ 2 DETIK)
                        if (step === 0) {
                            // Tahap 1: Kuning - Full Course Yellow
                            mainText.innerText = "FULL COURSE YELLOW";
                            subText.innerText = "";
                            display.style.backgroundColor = globalStatus.bg;
                            display.style.color = globalStatus.color;
                        } else if (step === 1) {
                            // Tahap 2: Hitam - 80 KM/H
                            mainText.innerText = "80 KM/H";
                            subText.innerText = "";
                            display.style.backgroundColor = "#000000";
                            display.style.color = "#ffffff";
                        } else if (step === 2) {
                            // Tahap 3: Kuning - Don't Overtake
                            mainText.innerText = "DON'T OVERTAKE";
                            subText.innerText = "";
                            display.style.backgroundColor = globalStatus.bg;
                            display.style.color = globalStatus.color;
                        } else if (step === 3) {
                            // Tahap 4: Hitam - 80 KM/H
                            mainText.innerText = "80 KM/H";
                            subText.innerText = "";
                            display.style.backgroundColor = "#000000";
                            display.style.color = "#ffffff";
                        }
                        step = (step + 1) % 4; // Berputar 0 -> 1 -> 2 -> 3 -> 0

                    } else {
                        // SIKLUS STANDARD (Yellow Flag / Red Flag biasa: 2 tahap ganti-ganti)
                        if (step === 0) {
                            mainText.innerText = globalStatus.text;
                            subText.innerText = "";
                            display.style.backgroundColor = globalStatus.bg;
                            display.style.color = globalStatus.color;
                        } else {
                            mainText.innerText = globalStatus.subText || globalStatus.text;
                            subText.innerText = "";
                            display.style.backgroundColor = "#000000";
                            display.style.color = "#ffffff";
                        }
                        step = (step + 1) % 2;
                    }
                }

                updateBlink();
                // Durasi diset ke 2000ms (2 detik) per tampilan teks/warna
                blinkInterval = setInterval(updateBlink, 2000);

            } else {
                mainText.innerText = globalStatus.text || "WAITING...";
                subText.innerText = globalStatus.subText || "";
                display.style.backgroundColor = globalStatus.bg || "#333333";
                display.style.color = globalStatus.color || "#ffffff";
            }
        });
    </script>
</body>
</html>
