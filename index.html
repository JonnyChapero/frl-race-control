<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Control Flag System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .mode-select { text-align: center; padding: 20px; }
        .mode-title { font-size: 22px; font-weight: bold; margin-bottom: 25px; }
        .mode-btn { display: block; width: 240px; padding: 16px; margin: 12px auto; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-admin { background: #007bff; color: white; }
        .btn-driver { background: #28a745; color: white; }

        #admin-panel { display: none; width: 100%; max-width: 450px; padding: 20px; text-align: center; }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .flag-btn { padding: 18px 10px; font-size: 15px; font-weight: 900; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        .flag-green { background: #00e676; color: #000; }
        .flag-yellow { background: #ffea00; color: #000; }
        .flag-red { background: #ff1744; color: #fff; }
        .flag-fcy { background: #ff9100; color: #000; }
        .flag-clear { background: #333; color: #fff; grid-column: span 2; border: 1px solid #555; }

        #driver-display { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: #000; justify-content: center; align-items: center; }
        .flag-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 4px solid #ffffff; }
        .flag-text { font-size: calc(8vw + 16px); font-weight: 900; font-family: 'Arial Black', Impact, sans-serif; text-transform: uppercase; letter-spacing: 3px; }

        .blink { animation: flash-anim 0.5s infinite alternate; }
        @keyframes flash-anim { 0% { opacity: 1.0; } 50% { opacity: 0.25; } 100% { opacity: 1.0; } }
    </style>
</head>
<body>

    <div id="mode-selector" class="mode-select">
        <div class="mode-title">RACE CONTROL SYSTEM</div>
        <button class="mode-btn btn-admin" onclick="enableMode('admin')">Buka Panel Admin</button>
        <button class="mode-btn btn-driver" onclick="enableMode('driver')">Buka Tampilan Driver</button>
    </div>

    <div id="admin-panel">
        <h2 style="margin-bottom:15px;">RACE DIRECTOR</h2>
        <div class="grid-buttons">
            <button class="flag-btn flag-green" onclick="sendFlag('GREEN', '#00e676', '#000000')">GREEN FLAG</button>
            <button class="flag-btn flag-yellow" onclick="sendFlag('YELLOW', '#ffea00', '#000000')">YELLOW FLAG</button>
            <button class="flag-btn flag-red" onclick="sendFlag('RED', '#ff1744', '#ffffff')">RED FLAG</button>
            <button class="flag-btn flag-fcy" onclick="sendFlag('FCY', '#ff9100', '#000000')">FULL COURSE YELLOW</button>
            <button class="flag-btn flag-clear" onclick="sendFlag('CLEAR', '#000000', '#ffffff')">MATIKAN BENDERA</button>
        </div>
    </div>

    <div id="driver-display">
        <div id="flag-box" class="flag-container">
            <div id="flag-text" class="flag-text">OFF</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // GANTI LINK DI BAWAH INI DENGAN LINK REALTIME DATABASE KAMU:
        const firebaseConfig = {
            databaseURL: "PASTE_LINK_FIREBASE_KAMU_DI_SINI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.enableMode = function(mode) {
            document.getElementById('mode-selector').style.display = 'none';
            if (mode === 'admin') {
                document.getElementById('admin-panel').style.display = 'block';
            } else if (mode === 'driver') {
                document.getElementById('driver-display').style.display = 'flex';
                listenToFlags();
            }
        };

        window.sendFlag = function(type, bgColor, textColor) {
            set(ref(db, 'race_status'), {
                type: type,
                bgColor: bgColor,
                textColor: textColor,
                timestamp: Date.now()
            });
        };

        function listenToFlags() {
            const raceRef = ref(db, 'race_status');
            onValue(raceRef, (snapshot) => {
                const data = snapshot.val();
                const driverDisplay = document.getElementById('driver-display');
                const flagBox = document.getElementById('flag-box');
                const flagText = document.getElementById('flag-text');

                if (data && data.type !== 'CLEAR') {
                    driverDisplay.style.display = 'flex';
                    flagBox.style.backgroundColor = data.bgColor;
                    flagText.style.color = data.textColor;
                    flagText.innerText = data.type;
                    flagBox.classList.add('blink');
                } else {
                    driverDisplay.style.display = 'none';
                    flagBox.classList.remove('blink');
                }
            });
        }
    </script>
</body>
</html>
