<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- KODE PENCEGAH CACHE BROWSER -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>FR Legends Race Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        
        /* Menu Utama */
        #home-menu { margin-top: 50px; }
        .nav-btn { display: block; width: 80%; max-width: 300px; margin: 15px auto; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-admin { background-color: #007bff; }
        .btn-driver { background-color: #28a745; }
        
        /* Halaman Tersembunyi Default */
        .page { display: none; margin-top: 20px; }
        
        /* Tampilan Driver */
        #flag-display { 
            width: 100%; 
            height: 300px; 
            line-height: 300px; 
            font-size: 28px; 
            font-weight: bold; 
            border-radius: 12px; 
            margin-top: 20px; 
            background-color: #333; 
            color: white; 
            text-transform: uppercase; 
            transition: none; /* Tanpa efek animasi fade agar ganti secara tegas */
        }

        /* Tombol Admin */
        .flag-btn { width: 90%; max-width: 350px; padding: 18px; margin: 10px auto; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; display: block; }
        .green { background-color: #28a745; color: white; }
        .yellow { background-color: #ffc107; color: black; }
        .fcy { background-color: #ff9800; color: black; }
        .red { background-color: #dc3545; color: white; }
        .finish { background-color: #000; color: white; border: 2px solid #fff; }
        .clear { background-color: #333; color: white; border: 1px solid #555; }
        
        .back-btn { background-color: #6c757d; color: white; margin-top: 20px; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>RACE CONTROL SYSTEM</h1>

    <!-- Menu Utama -->
    <div id="home-menu">
        <button class="nav-btn btn-admin" onclick="checkAdminPassword()">Buka Panel Admin</button>
        <button class="nav-btn btn-driver" onclick="showPage('driver-page')">Buka Tampilan Driver</button>
    </div>

    <!-- Halaman Admin -->
    <div id="admin-page" class="page">
        <h2>Panel Race Director</h2>
        <br>
        <button class="flag-btn green" onclick="setFlag('GREEN FLAG', '', '#28a745', '#ffffff', false)">GREEN FLAG</button>
        <button class="flag-btn yellow" onclick="setFlag('YELLOW FLAG', 'LIMIT 80 KM/H', '#ffc107', '#000000', true)">YELLOW FLAG (BLINK)</button>
        <button class="flag-btn fcy" onclick="setFlag('FULL COURSE YELLOW', 'LIMIT 80 KM/H', '#ff9800', '#000000', true)">FULL COURSE YELLOW (FCY)</button>
        <button class="flag-btn red" onclick="setFlag('RED FLAG', '50 KM/H & BACK TO PIT', '#dc3545', '#ffffff', true)">RED FLAG (BLINK)</button>
        <button class="flag-btn finish" onclick="setFlag('FINISH / CHEQUERED', '', '#000000', '#ffffff', false)">FINISH</button>
        <button class="flag-btn clear" onclick="setFlag('TRACK CLEAR', '', '#333333', '#ffffff', false)">TRACK CLEAR</button>
        <br>
        <button class="back-btn" onclick="showPage('home-menu')">Kembali ke Menu</button>
    </div>

    <!-- Halaman Driver -->
    <div id="driver-page" class="page">
        <h2>Tampilan Driver</h2>
        <div id="flag-display">WAITING RACE...</div>
        <br>
        <button class="back-btn" onclick="showPage('home-menu')">Kembali ke Menu</button>
    </div>

    <!-- Firebase SDK & Script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const ADMIN_PASSWORD = "wildunnigga123";

        const firebaseConfig = {
            databaseURL: "https://frl-race-direction-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let blinkInterval = null; // Menyimpan timer interval kedip

        function showPage(pageId) {
            document.getElementById('home-menu').style.display = 'none';
            document.getElementById('admin-page').style.display = 'none';
            document.getElementById('driver-page').style.display = 'none';
            
            document.getElementById(pageId).style.display = 'block';
        }

        function checkAdminPassword() {
            let pass = prompt("Masukkan Password Race Director:");
            if (pass === ADMIN_PASSWORD) {
                showPage('admin-page');
            } else if (pass !== null) {
                alert("Password Salah! Anda tidak memiliki akses ke Panel Admin.");
            }
        }

        // Fungsi Admin Mengirim Status
        function setFlag(statusText, subText, bgColor, textColor, isBlinking) {
            database.ref('race/status').set({
                text: statusText,
                subText: subText || '',
                bg: bgColor,
                color: textColor,
                blink: isBlinking || false
            });
        }

        // Realtime Listener Driver
        database.ref('race/status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const display = document.getElementById('flag-display');
                
                // Hentikan timer kedip sebelumnya jika ada
                if (blinkInterval) {
                    clearInterval(blinkInterval);
                    blinkInterval = null;
                }

                if (data.blink) {
                    let showFlagState = true;

                    // Fungsi untuk update tampilan secara presisi
                    function updateDisplay() {
                        if (showFlagState) {
                            // Tampilan 1: Nama Bendera + Warna Bendera
                            display.innerText = data.text;
                            display.style.backgroundColor = data.bg;
                            display.style.color = data.color;
                        } else {
                            // Tampilan 2: Teks Peringatan/Limit + Latar Hitam (Teks Putih)
                            display.innerText = data.subText;
                            display.style.backgroundColor = '#000000';
                            display.style.color = '#ffffff';
                        }
                    }

                    // Tampilkan bendera utama pertama kali
                    updateDisplay();

                    // Berganti tampilan presisi setiap 0.75 detik (750ms)
                    blinkInterval = setInterval(() => {
                        showFlagState = !showFlagState;
                        updateDisplay();
                    }, 750);

                } else {
                    // Bendera Diam (Tanpa Kedip: Green, Clear, Finish)
                    display.innerText = data.text;
                    display.style.backgroundColor = data.bg;
                    display.style.color = data.color;
                }
            }
        });
    </script>
</body>
</html>
