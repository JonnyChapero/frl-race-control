<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Legends Race Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .nav-btn { display: inline-block; padding: 12px 24px; margin: 10px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-admin { background-color: #007bff; }
        .btn-driver { background-color: #28a745; }
        .page { display: none; margin-top: 20px; }
        .active { display: block; }
        
        /* Box Display Bendera Driver */
        #flag-display { width: 100%; height: 250px; line-height: 250px; font-size: 32px; font-weight: bold; border-radius: 12px; margin-top: 20px; background-color: #333; color: white; text-transform: uppercase; transition: background-color 0.3s ease; }
        
        /* Tombol Admin */
        .flag-btn { width: 80%; padding: 15px; margin: 8px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .green { background-color: #28a745; color: white; }
        .yellow { background-color: #ffc107; color: black; }
        .red { background-color: #dc3545; color: white; }
        .finish { background-color: #000; color: white; border: 2px solid #fff; }
    </style>
</head>
<body>

    <h1>RACE CONTROL SYSTEM</h1>

    <div>
        <button class="nav-btn btn-admin" onclick="showPage('admin-page')">Buka Panel Admin</button>
        <button class="nav-btn btn-driver" onclick="showPage('driver-page')">Buka Tampilan Driver</button>
    </div>

    <!-- Halaman Admin -->
    <div id="admin-page" class="page">
        <h2>Panel Race Director</h2>
        <br>
        <button class="flag-btn green" onclick="setFlag('GREEN FLAG', '#28a745', '#ffffff')">GREEN FLAG</button><br>
        <button class="flag-btn yellow" onclick="setFlag('YELLOW FLAG', '#ffc107', '#000000')">YELLOW FLAG</button><br>
        <button class="flag-btn red" onclick="setFlag('RED FLAG', '#dc3545', '#ffffff')">RED FLAG</button><br>
        <button class="flag-btn finish" onclick="setFlag('FINISH / CHEQUERED', '#000000', '#ffffff')">FINISH</button>
    </div>

    <!-- Halaman Driver -->
    <div id="driver-page" class="page">
        <h2>Tampilan Driver</h2>
        <div id="flag-display">WAITING RACE...</div>
    </div>

    <!-- Firebase SDK & Script Sistem -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Masukkan Konfigurasi Firebase Kamu di Bawah Ini
        const firebaseConfig = {
            databaseURL: "https://frl-race-control-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // Fungsi Perpindahan Halaman
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Fungsi Admin Mengirim Bendera ke Firebase
        function setFlag(statusText, bgColor, textColor) {
            database.ref('race/status').set({
                text: statusText,
                bg: bgColor,
                color: textColor
            });
        }

        // Realtime Listener untuk Driver
        database.ref('race/status').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const display = document.getElementById('flag-display');
                display.innerText = data.text;
                display.style.backgroundColor = data.bg;
                display.style.color = data.color;
            }
        });
    </script>
</body>
</html>
