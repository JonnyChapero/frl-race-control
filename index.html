    <!-- Firebase SDK & Script -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const ADMIN_PASSWORD = "flgstest";

        const firebaseConfig = {
            databaseURL: "https://frl-race-direction-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let myDriverNumber = localStorage.getItem('registered_driver_num') || "";
        let blinkInterval = null;

        // AUTO-CHECK SAAT WEB DIBUKA/REFRESH
        window.addEventListener('DOMContentLoaded', () => {
            if (myDriverNumber) {
                // Jika HP ini sudah pernah mendaftar, langsung kunci & tampilkan layar bendera
                showPage('driver-page', false);
            }
        });

        function showPage(pageId, addHistory = true) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');

            if (addHistory && pageId !== 'home-menu') {
                history.pushState({ page: pageId }, "", "#" + pageId);
            }
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.page) {
                // Kalau HP sudah terdaftar, jangan biarkan kembali ke menu/form via tombol back browser
                if (myDriverNumber && event.state.page !== 'driver-page') {
                    showPage('driver-page', false);
                } else {
                    showPage(event.state.page, false);
                }
            } else {
                if (myDriverNumber) {
                    showPage('driver-page', false);
                } else {
                    showPage('home-menu', false);
                }
            }
        });

        function handleDriverClick() {
            if (myDriverNumber) {
                showPage('driver-page');
            } else {
                showPage('driver-setup');
            }
        }

        function openPasswordModal() {
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('password-modal').style.display = 'block';
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
        }

        function verifyPassword() {
            const input = document.getElementById('admin-pass-input').value;
            if (input === ADMIN_PASSWORD) {
                closePasswordModal();
                showPage('admin-page');
            } else {
                alert("Password Salah!");
            }
        }

        // REGISTRASI DRIVER BARU (DENGAN CEK CEGAH DUPLIKASI NAMA & NOMOR)
        function registerDriver() {
            const nameInput = document.getElementById('driver-name').value.trim();
            const numInput = document.getElementById('driver-number').value.trim();

            if (!nameInput || !numInput) {
                alert("Mohon isi Nama dan Nomor Mobil!");
                return;
            }

            // Cek ke Firebase apakah Nama atau Nomor sudah dipakai
            database.ref('race/drivers').once('value', (snapshot) => {
                const drivers = snapshot.val() || {};
                
                let isNumTaken = false;
                let isNameTaken = false;

                Object.keys(drivers).forEach(key => {
                    if (drivers[key].number === numInput) isNumTaken = true;
                    if (drivers[key].name.toLowerCase() === nameInput.toLowerCase()) isNameTaken = true;
                });

                if (isNumTaken) {
                    alert("Nomor Mobil #" + numInput + " sudah digunakan! Pilih nomor lain.");
                    return;
                }

                if (isNameTaken) {
                    alert("Nama '" + nameInput + "' sudah terdaftar! Jika kamu sudah mendaftar sebelumnya, tidak perlu mendaftar ulang.");
                    return;
                }

                // Jika lolos verifikasi:
                localStorage.setItem('registered_driver_num', numInput);
                myDriverNumber = numInput;

                database.ref('race/drivers/' + numInput).set({
                    name: nameInput,
                    number: numInput
                });

                showPage('driver-page');
            });
        }

        // BENDERA GLOBAL
        function setGlobalFlag(statusText, subText, bgColor, textColor, isBlinking) {
            database.ref('race/blue_flags').remove();

            database.ref('race/status').set({
                text: statusText,
                subText: subText || '',
                bg: bgColor,
                color: textColor,
                blink: isBlinking || false
            });
        }

        // TOGGLE BLUE FLAG
        function toggleBlueFlag(driverNum) {
            const ref = database.ref('race/blue_flags/' + driverNum);
            ref.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    ref.remove();
                } else {
                    ref.set(true);
                }
            });
        }

        function clearAllBlueFlags() {
            database.ref('race/blue_flags').remove();
        }

        // HAPUS SEMUA DRIVER DARI PANEL ADMIN (RESET SETELAH RACE)
        function removeAllDrivers() {
            if (confirm("Yakin ingin menghapus SELURUH daftar driver dari session ini?")) {
                database.ref('race/drivers').remove();
                database.ref('race/blue_flags').remove();
            }
        }

        // LISTEN DAFTAR DRIVER UNTUK PANEL ADMIN
        database.ref('race/drivers').on('value', (snapshot) => {
            const listDiv = document.getElementById('driver-buttons-list');
            const drivers = snapshot.val();
            
            // Jika admin menghapus daftar driver di Firebase, reset juga memori lokal HP driver
            if (!drivers) {
                if (myDriverNumber) {
                    localStorage.removeItem('registered_driver_num');
                    myDriverNumber = "";
                    showPage('home-menu');
                }
                if (listDiv) listDiv.innerHTML = '<i style="font-size:12px; color:#888;">Belum ada driver terhubung...</i>';
                return;
            }

            database.ref('race/blue_flags').on('value', (blueSnap) => {
                const blueList = blueSnap.val() || {};
                if (listDiv) {
                    listDiv.innerHTML = '';

                    Object.keys(drivers).forEach(num => {
                        const d = drivers[num];
                        const isBlue = blueList[num] ? true : false;

                        const btn = document.createElement('button');
                        btn.className = 'driver-blue-btn';
                        btn.style.backgroundColor = isBlue ? '#00d2ff' : '#0056b3';
                        btn.style.color = isBlue ? '#000' : '#fff';
                        btn.innerText = `#${d.number} - ${d.name} ${isBlue ? ' (BLUE)' : ''}`;
                        btn.onclick = () => toggleBlueFlag(d.number);

                        listDiv.appendChild(btn);
                    });
                }
            });
        });

        // LISTEN STATUS BENDERA DI HP DRIVER
        database.ref('race').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const globalStatus = data.status || {};
            const blueFlags = data.blue_flags || {};

            const display = document.getElementById('flag-display');
            const mainText = document.getElementById('main-text');
            const subText = document.getElementById('sub-text');

            if (!display || !mainText || !subText) return;

            if (blinkInterval) {
                clearInterval(blinkInterval);
                blinkInterval = null;
            }

            // APAKAH HP INI KENA BLUE FLAG?
            if (myDriverNumber && blueFlags[myDriverNumber]) {
                let isBlue = true;
                mainText.innerText = "BLUE FLAG";
                subText.innerText = "GIVE WAY TO LEADER!";
                
                blinkInterval = setInterval(() => {
                    display.style.backgroundColor = isBlue ? "#0044ff" : "#000000";
                    display.style.color = "#ffffff";
                    isBlue = !isBlue;
                }, 500);

            } else if (globalStatus.blink) {
                let showState = true;

                function updateBlink() {
                    mainText.innerText = showState ? globalStatus.text : globalStatus.subText;
                    subText.innerText = showState ? globalStatus.subText : "";
                    display.style.backgroundColor = showState ? globalStatus.bg : "#000000";
                    display.style.color = showState ? globalStatus.color : "#ffffff";
                }

                updateBlink();
                blinkInterval = setInterval(() => {
                    showState = !showState;
                    updateBlink();
                }, 750);

            } else {
                mainText.innerText = globalStatus.text || "WAITING...";
                subText.innerText = globalStatus.subText || "";
                display.style.backgroundColor = globalStatus.bg || "#333333";
                display.style.color = globalStatus.color || "#ffffff";
            }
        });
    </script>
